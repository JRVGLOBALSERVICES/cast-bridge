# Public HTTPS for the cast stream proxy.  185.227.134.127 -> 127.0.0.1:7801
#
# A Cast receiver is a Chrome instance loading a page over https, so the
# media address it is handed must be https too — an http URL is mixed
# content and is dropped before a byte is fetched. That, and not the
# bandwidth, is why this needs a certificate at all.
#
# SCOPE IS DELIBERATELY NARROW, for the same reason hook.jrvsystems.app is:
# this is a new public hostname on a box that also runs the bridge, the
# dashboard and an admin console. Exactly two paths answer here. Everything
# else is 404. Do not add a catch-all `location /`.

# A media proxy that anyone can reach is a media proxy anyone can use. The
# real guard is in api/stream.js — every hop is checked against private
# address space and the content type is checked against media before a byte
# is relayed — but neither of those stops someone simply pointing volume at
# it. These make that expensive. Sized for a television, which asks for one
# segment every few seconds and opens a handful of connections, not for a
# scraper.
limit_req_zone  $binary_remote_addr zone=stream_req:20m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=stream_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name stream.jrvsystems.app;

    # Renewal uses the webroot authenticator recorded in the certbot renewal
    # config, so this location has to keep working — dropping it breaks
    # renewal silently, ~60 days from now, with no failing test.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `http2 on;` is nginx >= 1.25 syntax; this host runs 1.24, where HTTP/2
    # is still a listen parameter.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stream.jrvsystems.app;

    ssl_certificate     /etc/letsencrypt/live/stream.jrvsystems.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.jrvsystems.app/privkey.pem;

    server_tokens off;
    access_log /var/log/nginx/stream.access.log;
    error_log  /var/log/nginx/stream.error.log;

    location = /healthz {
        proxy_pass http://127.0.0.1:7801;
        proxy_set_header Host $host;
    }

    location = /api/stream {
        limit_req  zone=stream_req burst=60 nodelay;
        limit_conn stream_conn 32;
        # A refusal here is rate limiting, and 429 is what says so. nginx's
        # default 503 is the same code it uses for an upstream that is down,
        # which would send anyone reading the cast log looking in the wrong
        # place. Measured: at 16 the connection cap, not the request rate,
        # was the binding constraint — 30 parallel fetches from one address
        # got exactly 16 through. A television multiplexes its segments over
        # HTTP/2 and needs a handful, but a household is one address for the
        # TV, the phone and whatever else is on the wifi, and behind CGNAT it
        # is one address for the neighbours too.
        limit_req_status  429;
        limit_conn_status 429;

        # Nothing is ever sent to this endpoint; a body would only be
        # someone probing it.
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        client_max_body_size 1k;

        proxy_pass http://127.0.0.1:7801;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Seeking is a Range request. Dropping it here would turn every
        # skip forward on the television into a refetch from zero.
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;

        # THE LOAD-BEARING LINE. With buffering on, nginx reads the whole
        # upstream response to disk before sending any of it — which for a
        # film means the television waits for a multi-gigabyte download to
        # finish before it can show frame one, and the disk fills. Off, the
        # bytes pass straight through.
        proxy_buffering off;
        proxy_request_buffering off;

        # These bound the gap BETWEEN reads, not the length of the
        # response, so a three-hour film is fine and a dead origin still
        # fails in a minute rather than holding a slot forever.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------- A file from the phone ----------
    #
    # The television cannot fetch off a phone, so the phone puts the file
    # here first. Three routes, and they have opposite needs: the upload is
    # one enormous body, the file fetch is many small windows, and the
    # storage report is a handful of bytes that must never be cached.

    location = /api/upload {
        limit_conn stream_conn 8;
        limit_conn_status 429;
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }

        # A film is the body. 0 means "do not impose a limit of your own" —
        # the real ceiling is CAST_MAX_UPLOAD_BYTES in the service, which
        # can refuse with a sentence instead of nginx's bare 413.
        client_max_body_size 0;
        client_body_timeout 300s;

        proxy_pass http://127.0.0.1:7801;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Same reason as the stream route, in the other direction: buffered,
        # nginx would spool the whole upload to its own disk first, so the
        # file would land twice and the app's progress bar would finish long
        # before the file did.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Quoted: nginx reads an unquoted { or } in a location as the start or
    # end of a block, so a bare {32} is a syntax error, not a repeat count.
    location ~ "^/f/[0-9a-f]{32}$" {
        limit_req  zone=stream_req burst=60 nodelay;
        limit_conn stream_conn 32;
        limit_req_status  429;
        limit_conn_status 429;
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        client_max_body_size 1k;

        proxy_pass http://127.0.0.1:7801;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;

        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location ^~ /api/storage {
        limit_req  zone=stream_req burst=10 nodelay;
        limit_req_status 429;
        if ($request_method !~ ^(GET|POST|OPTIONS)$) { return 405; }
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:7801;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / { return 404; }
}
